name: ux-audit-rollout

# Portfolio UX-audit rollout. Manual trigger only (no schedule), so it can
# never fire an unreviewed change.
#
# Job 1 (report): deterministic. Runs the offline content guardrail across a
#   matrix of site repos and writes a report to the run summary + artifacts.
#   Needs no API key and opens nothing. Safe to run any time.
#
# Job 2 (propose_fixes): gated behind the `open_fix_prs` input. Runs Claude
#   Code headless per repo to open ONE branch + PR of proposed fixes. It never
#   merges and never pushes to a default branch. Requires two secrets:
#     ANTHROPIC_API_KEY  - model access
#     PORTFOLIO_PAT      - a fine-grained PAT with contents:write + pull_requests:write
#                          on the target site repos (GITHUB_TOKEN cannot reach
#                          other repos).
#
# Model split mirrors the manual audit: Sonnet scans/edits, a stronger model
# verifies. Override per run via the `fix_model` input.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated owner/repo list (blank = all in matrix default)'
        type: string
        default: ''
      open_fix_prs:
        description: 'Also open fix PRs (needs ANTHROPIC_API_KEY + PORTFOLIO_PAT)'
        type: boolean
        default: false
      fix_model:
        description: 'Model for the fix pass'
        type: choice
        default: claude-sonnet-5
        options:
          - claude-sonnet-5
          - claude-fable-5
          - claude-opus-5

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repo:
          - sunnyp81/thebestmowers
          - sunnyp81/towrating
          - sunnyp81/bestvibrationplates
          - sunnyp81/redlighttherapy-expert
          - sunnyp81/mugscafe-site
          - sunnyp81/towerfanreviews
    steps:
      - name: Checkout target site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.PORTFOLIO_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch the guardrail script
        uses: actions/checkout@v4
        with:
          repository: sunnyp81/sunnyp81
          sparse-checkout: hermes/guardrail
          sparse-checkout-cone-mode: false
          path: _guardrail

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guardrail report (never fails)
        run: |
          python _guardrail/hermes/guardrail/check_content.py --root . --warn-only \
            | tee guardrail-report.txt
          echo "### ${{ matrix.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 guardrail-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: guardrail-${{ strategy.job-index }}
          path: guardrail-report.txt

  propose_fixes:
    if: ${{ inputs.open_fix_prs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: report
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repo:
          - sunnyp81/thebestmowers
          - sunnyp81/towrating
          - sunnyp81/bestvibrationplates
          - sunnyp81/redlighttherapy-expert
          - sunnyp81/mugscafe-site
          - sunnyp81/towerfanreviews
    env:
      BRANCH: claude/ux-audit-guardrail-fixes
    steps:
      - name: Checkout target site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.PORTFOLIO_PAT }}
          fetch-depth: 0

      - name: Fetch the guardrail script
        uses: actions/checkout@v4
        with:
          repository: sunnyp81/sunnyp81
          sparse-checkout: hermes/guardrail
          sparse-checkout-cone-mode: false
          path: _guardrail

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create working branch
        run: |
          git config user.name  "ux-audit-bot"
          git config user.email "ux-audit-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"

      - name: Propose fixes (branch only, never merges)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          REPORT="$(python _guardrail/hermes/guardrail/check_content.py --root . --warn-only || true)"
          claude -p --model "${{ inputs.fix_model }}" --permission-mode acceptEdits "
          You are fixing UX-audit defects in this affiliate site. Rules:
          British English on .co.uk sites. NEVER use em or en dashes.
          Never state a fault as fact without file:line evidence.
          Do NOT invent product photos, reviews, testing, statistics, or personas.
          Apply only the fixes below and only where the guardrail report cites them.
          Then run the site build if package.json has a build script and stop if it fails.

          Guardrail report:
          ${REPORT}

          Fixes to apply where the report flags them:
          1. Remove em/en dashes from flagged content (comma, colon, or hyphen).
          2. Delete any Person JSON-LD node and persona byline the report names;
             set schema author/publisher to the Organization. Do not reword to keep it.
          3. Remove any first-person we-tested / we-measured / our-lab claim that is
             not backed by data in the repo; reframe as research-led.
          4. Resolve any git conflict marker.
          Leave everything else untouched."

      - name: Push branch and open PR (no auto-merge)
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes proposed for ${{ matrix.repo }}."
            exit 0
          fi
          git add -A
          git commit -m "UX-audit guardrail fixes (proposed, review before merge)"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --repo "${{ matrix.repo }}" --head "$BRANCH" \
            --title "UX-audit guardrail fixes (review before merge)" \
            --body "Automated proposal from ux-audit-rollout. Branch only, not merged. Review each change against the guardrail report before merging." \
            --draft || echo "PR may already exist; left branch pushed."

  # ---------------------------------------------------------------------------
  # Layer 1b: Codex proposes fixes on its own branch, same rules as the Claude
  # job. Cross-vendor on purpose: layer 2 has each vendor verify the other's
  # work, which breaks correlated errors. Auth: CODEX_AUTH_JSON secret
  # (ChatGPT subscription, preferred; mint by running 'codex login' once on
  # any machine and pasting ~/.codex/auth.json into the secret) or
  # OPENAI_API_KEY as fallback. Subscription tokens refresh themselves via the
  # stored refresh token but can eventually expire; re-mint the secret if the
  # lane starts failing auth.
  # NOTE: the Codex CLI is young; pin/adjust the exec invocation if the
  # installed version's flags differ.
  # ---------------------------------------------------------------------------
  propose_fixes_codex:
    if: ${{ inputs.open_fix_prs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: report
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repo:
          - sunnyp81/thebestmowers
          - sunnyp81/towrating
          - sunnyp81/bestvibrationplates
          - sunnyp81/redlighttherapy-expert
          - sunnyp81/mugscafe-site
          - sunnyp81/towerfanreviews
    env:
      BRANCH: codex/ux-audit-fixes
    steps:
      - name: Checkout target site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.PORTFOLIO_PAT }}
          fetch-depth: 0

      - name: Fetch the guardrail script
        uses: actions/checkout@v4
        with:
          repository: sunnyp81/sunnyp81
          sparse-checkout: hermes/guardrail
          sparse-checkout-cone-mode: false
          path: _guardrail

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Authenticate Codex (ChatGPT subscription preferred)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ~/.codex
          if [ -n "$CODEX_AUTH_JSON" ]; then
            printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
            echo "codex: using ChatGPT subscription auth (CODEX_AUTH_JSON)"
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "codex: falling back to OPENAI_API_KEY"
          else
            echo "codex: no auth configured. Set CODEX_AUTH_JSON (preferred: run"
            echo "'codex login' once on any machine, then paste ~/.codex/auth.json"
            echo "into the secret) or OPENAI_API_KEY."
            exit 1
          fi

      - name: Create working branch
        run: |
          git config user.name  "ux-audit-codex-bot"
          git config user.email "ux-audit-codex-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"

      - name: Propose fixes (branch only, never merges)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          REPORT="$(python3 _guardrail/hermes/guardrail/check_content.py --root . --warn-only || true)"
          codex exec --full-auto "You are fixing UX-audit defects in this affiliate site. Rules:
          British English on .co.uk sites. NEVER use em or en dashes.
          Never state a fault as fact without file:line evidence.
          Do NOT invent product photos, reviews, testing, statistics, or personas.
          Apply only the fixes below and only where the guardrail report cites them.
          Then run the site build if package.json has a build script and stop if it fails.

          Guardrail report:
          ${REPORT}

          Fixes to apply where the report flags them:
          1. Remove em/en dashes from flagged content (comma, colon, or hyphen).
          2. Delete any Person JSON-LD node and persona byline the report names;
             set schema author/publisher to the Organization. Do not reword to keep it.
          3. Remove any first-person we-tested / we-measured / our-lab claim that is
             not backed by data in the repo; reframe as research-led.
          4. Resolve any git conflict marker.
          Leave everything else untouched."

      - name: Push branch and open PR (no auto-merge)
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes proposed for ${{ matrix.repo }}."
            exit 0
          fi
          git add -A
          git commit -m "UX-audit guardrail fixes via Codex (proposed, review before merge)"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create --repo "${{ matrix.repo }}" --head "$BRANCH" \
            --title "UX-audit guardrail fixes via Codex (review before merge)" \
            --body "Automated proposal from ux-audit-rollout (Codex lane). Branch only, not merged. A cross-vendor verify pass reviews this PR; check its comment before merging." \
            --draft || echo "PR may already exist; left branch pushed."

  # ---------------------------------------------------------------------------
  # Layer 2: adversarial cross-vendor verify. Claude verifies the Codex branch,
  # Codex verifies the Claude branch. Read-only: it edits nothing, it posts a
  # claim-by-claim verdict comment on each proposal PR. A claim with no
  # file:line + source does not survive. Humans still merge.
  # ---------------------------------------------------------------------------
  verify_proposals:
    if: ${{ always() && inputs.open_fix_prs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [propose_fixes, propose_fixes_codex]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repo:
          - sunnyp81/thebestmowers
          - sunnyp81/towrating
          - sunnyp81/bestvibrationplates
          - sunnyp81/redlighttherapy-expert
          - sunnyp81/mugscafe-site
          - sunnyp81/towerfanreviews
    steps:
      - name: Checkout target site repo (all branches)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.PORTFOLIO_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install both CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Authenticate Codex (ChatGPT subscription preferred)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ~/.codex
          if [ -n "$CODEX_AUTH_JSON" ]; then
            printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
            chmod 600 ~/.codex/auth.json
            echo "codex: using ChatGPT subscription auth (CODEX_AUTH_JSON)"
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "codex: falling back to OPENAI_API_KEY"
          else
            echo "codex: no auth; the codex verify lane will be skipped."
          fi

      - name: Cross-verify each proposal branch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          set +e
          default_branch=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
          verify_one () {
            branch="$1"; verifier="$2"
            git rev-parse --verify "origin/$branch" >/dev/null 2>&1 || { echo "no $branch branch"; return 0; }
            git checkout -q "origin/$branch"
            git diff "origin/${default_branch}...HEAD" > /tmp/proposal.diff
            [ -s /tmp/proposal.diff ] || { echo "$branch: empty diff"; return 0; }
            PROMPT="Adversarially verify this proposed diff for an affiliate site.
          For EVERY factual claim the diff introduces or rewords, output one line:
          file:line | claim | verdict KEEP or DROP | reason. DROP anything not
          backed by evidence in the repo. Also flag any new em/en dash, persona,
          or invented testing language the diff adds. Do not edit any file.
          Diff follows:
          $(cat /tmp/proposal.diff | head -c 60000)"
            if [ "$verifier" = "claude" ]; then
              claude -p --model claude-fable-5 --permission-mode plan "$PROMPT" > /tmp/verdict.txt
            else
              codex exec --full-auto --read-only "$PROMPT" > /tmp/verdict.txt 2>&1 || codex exec --full-auto "$PROMPT" > /tmp/verdict.txt
            fi
            pr=$(gh pr list --repo "${{ matrix.repo }}" --head "$branch" --json number --jq '.[0].number')
            if [ -n "$pr" ] && [ "$pr" != "null" ]; then
              {
                echo "## Cross-vendor verify (${verifier} reviewing ${branch})"
                echo
                echo '```'
                head -c 20000 /tmp/verdict.txt
                echo '```'
                echo
                echo "---"
                echo "_Generated by [Claude Code](https://claude.ai/code)_"
              } > /tmp/comment.md
              gh pr comment "$pr" --repo "${{ matrix.repo }}" --body-file /tmp/comment.md
            fi
            git checkout -q "origin/${default_branch}"
          }
          verify_one "codex/ux-audit-fixes" "claude"
          verify_one "claude/ux-audit-guardrail-fixes" "codex"
